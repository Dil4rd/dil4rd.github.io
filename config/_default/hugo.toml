# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://dil4rd.me/"
defaultContentLanguage = "en"

# No content yet, so taxonomy pages would be empty. Drop when posts return.
disableKinds = ["taxonomy", "term"]

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
